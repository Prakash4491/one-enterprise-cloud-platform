<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Employee Management</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/emp-mng.css" />
  </head>

  <body>
    <div class="container">
      <div class="title-box">
        <h1>Employee Management</h1>

        <p>View and manage existing employee records.</p>

        <div class="management-buttons">
          <div class="button-group">
            <a href="registration.html" class="register-btn">
              ➕ Register New Employee
            </a>

            <a href="employee-directory.html" class="directory-btn">
              📋 Employee Directory
            </a>

            <a href="dashboard.html" class="back-btn"> ⬅️ Dashboard </a>
          </div>
        </div>
      </div>

      <div class="table-box">
        <div class="table-header">
          <div>
            <h2>Employee List</h2>

            <h3 id="totalEmployees">Total Employees : 0</h3>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>

                <th>Name</th>

                <th>Department</th>

                <th>Designation</th>

                <th>Email</th>

                <th>Action</th>
              </tr>
            </thead>

            <tbody id="employeeTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="js/emp-mng.js"></script>
  </body>
</html>
