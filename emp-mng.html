<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Employee Management</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/emp-mng.css" />
  </head>

  <body>
    <div class="container">
      <div class="title-box">
        <h1>Employee Management</h1>

        <p>Create and Manage Employee Records</p>

        <form id="employeeForm">
          <div class="form-grid">
            <div class="input-group">
              <label>Employee ID</label>

              <input
                type="text"
                id="employeeId"
                placeholder="EMP001"
                required
              />
            </div>

            <div class="input-group">
              <label>Employee Name</label>

              <input
                type="text"
                id="employeeName"
                placeholder="Enter Employee Name"
                required
              />
            </div>

            <div class="input-group">
              <label>Department</label>

              <select id="department" required>
                <option value="">Select Department</option>

                <option>Development</option>

                <option>HR</option>

                <option>Finance</option>

                <option>CRM</option>

                <option>ERP</option>
              </select>
            </div>

            <div class="input-group">
              <label>Designation</label>

              <input
                type="text"
                id="designation"
                placeholder="Enter Designation"
                required
              />
            </div>

            <div class="input-group full-width">
              <label>Email</label>

              <input
                type="email"
                id="email"
                placeholder="employee@company.com"
                required
              />
            </div>
          </div>

          <div class="button-group">
            <button type="submit" class="add-btn" id="submitBtn">
              Add Employee
            </button>

            <button type="reset" class="reset-btn">Reset</button>

            <a href="dashboard.html" class="back-btn"> ⬅️ Dashboard </a>

            <a href="employees.html" class="repos-btn">Repoistory ➡️</a>
          </div>
        </form>
      </div>

      <div class="table-box">
        <h2>Employee List</h2>

        <h3 id="totalEmployees">Total Employees : 0</h3>

        <table>
          <thead>
            <tr>
              <th>ID</th>

              <th>Name</th>

              <th>Department</th>

              <th>Designation</th>

              <th>Email</th>

              <th>Action</th>
            </tr>
          </thead>

          <tbody id="employeeTableBody"></tbody>
        </table>
      </div>
    </div>

    <script src="js/emp-mng.js"></script>
  </body>
</html>
